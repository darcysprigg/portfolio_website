<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Asap Sharp', sans-serif;
            background-color: #000000;
            color: #FFFFFF;
            margin: 0;
            padding: 20px;
            animation: fadeIn 0.1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .centered {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            min-height: 100vh;
        }

        .BackButton {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 36px;
            transition: color 0.1s;
        }

        .BackButton:hover {
            color: #d0d2d4;
        }

        .size-6 {
            width: 40px;
            height: 40px;
        }


        .BottomDescription {
            font-size: 12px;
            margin-top: 100px;
        }

        .subheader2 {
            margin-top: 70px;
            font-size: 30px;
        }

        .link {
            color: #0084ff;
            transition: color 0.1s;
        }

        .link:hover {
        color: #66b3ff;
        }

    </style>

</head>

<body>
    <script src="../script.js" defer></script>

    <div class="centered">

        <button class="BackButton" id="button_Back">
            <
        </button>

        <img src="../images/Resumepng.png" alt="Resume" width="800">

        <h2 class="subheader2">PDF Download</h2>

        <a href="../pdfs/Resume.pdf" download="Resume.pdf" class="link">
        Resume
        </a>

        <p class="BottomDescription">
            Created by Darcy Sprigg
        </p>

    </div>

</body>
