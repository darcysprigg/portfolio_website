<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Asap Sharp', sans-serif;
            background-color: #000000;
            color: #FFFFFF;
            margin: 0;
            padding: 20px;
            animation: fadeIn 0.1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .centered {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            min-height: 100vh;
        }

        .Title {
            font-size: 48px;
        }

        .BackButton {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 36px;
            transition: color 0.1s;
        }

        .BackButton:hover {
            color: #d0d2d4;
        }

        .BottomDescription {
            font-size: 12px;
            margin-top: 100px;
        }

        .subheader2 {
            margin-top: 70px;
            font-size: 30px;
        }

        .link {
            color: #0084ff;
            transition: color 0.1s;
        }

        .link:hover {
        color: #66b3ff;
        }

        .link::after {
        content: " ↓";
        transition: transform 0.2s;
        }

        .link:hover::after {
        display: inline-block;
        transform: translate(0px, 2px);
        }

        .notop {
            margin-top: 0px;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0F1115;
        }

        ::-webkit-scrollbar-thumb {
            background: #30343D;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #454A55;
        }

        .divider {
        width: 100%;
        max-width: 1500px;
        border: none;
        border-top: 1px solid #63666e;
        margin-top:15px;
        margin-bottom: 60px;
        }

        .sub-divider {
        width: 100%;
        max-width: 1000px;
        border: none;
        border-top: 1px solid #63666e;
        margin-top:60px;
        }

    </style>

</head>

<body>
    <script src="../script.js" defer></script>

    <div class="centered">

        <button class="BackButton" id="button_Back">
            ←
        </button>

        <h1 class="Title">Professional Resume</h1>

        <hr class="divider">

        <img src="../images/Resumepng.png" alt="Resume" width="800">

        <hr class="sub-divider">

        <h2 class="subheader2">PDF Download</h2>
        
        <p class="notop">
            <a href="../pdfs/Resume-DarcySprigg.pdf" download="Resume-DarcySprigg.pdf" class="link">
            Resume
            </a>
        </p>

        <p class="BottomDescription">
            Created by Darcy Sprigg
        </p>

    </div>

</body>
