<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: 'Asap Sharp', sans-serif;
            background-color: #000000;
            color: #FFFFFF;
            margin: 0;
            padding: 20px;
            animation: fadeIn 0.1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .centered {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            height: 100vh;
        }

        .BackButton {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 36px;
            transition: color 0.1s;
        }

        .BackButton:hover {
            color: #d0d2d4;
        }

        .size-6 {
            width: 40px;
            height: 40px;
        }

        .Title {
            font-size: 48px;
        }

    </style>

</head>

<body>
    <script src="../script.js" defer></script>

    <div class="centered">

        <button class="BackButton" id="back_projects">
            <
        </button>

        <h1 class="Title">Example report using Google's ticker: GOOG</h1>

        <iframe 
            src="../pdfs/GOOG_evaluation.pdf"
            width="800"
            height="1000">
        </iframe>

    </div>

</body>
