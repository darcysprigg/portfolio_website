<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: 'Asap Sharp', sans-serif;
            background-color: #FFFFFF;
            margin: 0;
            padding: 20px;
        }

        .centered {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            height: 100vh;
        }

        .BackButton {
            position: fixed;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .size-6 {
            width: 40px;
            height: 40px;
        }

        .Title {
            font-size: 48px;
        }

    </style>

</head>

<body>
    <script src="../script.js" defer></script>

    <div class="centered">

        <button class="BackButton" id="back_projects">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
                <path fill-rule="evenodd" d="M11.03 3.97a.75.75 0 0 1 0 1.06l-6.22 6.22H21a.75.75 0 0 1 0 1.5H4.81l6.22 6.22a.75.75 0 1 1-1.06 1.06l-7.5-7.5a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd" />
            </svg>
        </button>

        <h1 class="Title">Example Report for GOOG</h1>

        <iframe 
            src="../pdfs/GOOG_evaluation.pdf"
            width="800"
            height="1000">
        </iframe>

    </div>

</body>
